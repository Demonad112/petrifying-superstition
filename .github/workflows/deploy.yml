name: Deploy

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  pages:
    needs: ci
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  # Checks the live build under its real subpath: the page loads, a missing asset is a real 404
  # (no SPA fallback), and the bundled demo fixture is served as JSON.
  verify-pages:
    needs: pages
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check the live Pages build
        env:
          PAGE_URL: ${{ needs.pages.outputs.page_url }}
        run: |
          set -euo pipefail
          base="${PAGE_URL%/}/"
          probe() { curl -sS -o /dev/null -w '%{http_code} %{content_type}' "$1"; }
          r=$(probe "$base"); echo "index        -> $r"; [[ "$r" == "200 text/html"* ]]
          r=$(probe "${base}assets/does-not-exist.js"); echo "missing .js  -> $r"; [[ "$r" == 404* ]]
          js=$(curl -sS "$base" | grep -o 'assets/index-[^"]*\.js' | head -1)
          echo "entry        -> $js"; [[ -n "$js" ]]
          r=$(probe "$base$js"); echo "entry js     -> $r"; [[ "$r" == "200 "*javascript* ]]
          demo=$(curl -sS "$base$js" | grep -oE 'demo-[^"/]+-[A-Za-z0-9_-]{8}\.json' | head -1 || true)
          if [[ -z "$demo" ]]; then echo "no bundled demo: skipped"; exit 0; fi
          r=$(probe "${base}assets/$demo"); echo "demo json    -> $r"; [[ "$r" == "200 application/json"* ]]

  itch:
    needs: ci
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
      ITCH_USER: ${{ vars.ITCH_USER }}
      ITCH_GAME: ${{ vars.ITCH_GAME }}
    steps:
      - name: Check itch config
        id: cfg
        run: |
          if [ -z "$BUTLER_API_KEY" ] || [ -z "$ITCH_USER" ] || [ -z "$ITCH_GAME" ]; then
            echo "::warning title=itch deploy skipped::BUTLER_API_KEY secret or ITCH_USER/ITCH_GAME variables are not set"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.cfg.outputs.ready == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - if: steps.cfg.outputs.ready == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - if: steps.cfg.outputs.ready == 'true'
        run: npm ci && npm run build
      - name: Install butler
        if: steps.cfg.outputs.ready == 'true'
        run: |
          curl -sSfL -o butler.zip https://broth.itch.zone/butler/linux-amd64/LATEST/archive/default
          unzip -q butler.zip -d "$RUNNER_TEMP/butler"
          chmod +x "$RUNNER_TEMP/butler/butler"
          echo "$RUNNER_TEMP/butler" >> "$GITHUB_PATH"
      - name: Push to itch
        if: steps.cfg.outputs.ready == 'true'
        run: |
          butler -V
          butler push dist "$ITCH_USER/$ITCH_GAME:html5" --if-changed --userversion "$GITHUB_SHA"
